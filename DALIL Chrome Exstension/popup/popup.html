<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>دَلِيل</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 22px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      text-align: center;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(54, 199, 229, 0.45);
      margin-bottom: 8px;
      object-fit: contain;
    }
    .brand-title {
      margin: 0 0 4px;
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 11px;
      color: #36c7e5;
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.4;
    }
    .brand-desc {
      font-size: 10.5px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 16px;
    }
    .btn-launch {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: white;
      text-decoration: none;
      padding: 11px 14px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(54, 199, 229, 0.4);
      transition: all 0.2s;
    }
    .btn-launch:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <img src="../assets/dalil_logo_light.png" alt="DALIL" class="app-icon">
  <h3 class="brand-title">دَلِيل</h3>
  <div class="brand-sub">اكتشاف وجمع معلومات المواقع وسجلات الأماكن</div>
  <p class="brand-desc">
    المنصة الشاملة للمسح الشبكي واستكشاف المعالم والظاهرات الجغرافية وإحداثيات X و Y.
  </p>
  <button id="btnOpen" class="btn-launch">🚀 فتح لوحة التحكم المكانية</button>
  <script src="popup.js"></script>
</body>
</html>
